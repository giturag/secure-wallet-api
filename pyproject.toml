[project]
name = "secure-wallet-api"
version = "0.1.0"
description = "Security-focused digital wallet REST API built with FastAPI and PostgreSQL"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
]

[tool.uv]
package = false
